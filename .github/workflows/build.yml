name: Compilar APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'pc/servidor.py', 'pc/*.bat', 'pc/*.sh' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Só na 1ª vez: desempacota o projeto enviado em projeto.b64 e grava no repositório
      - name: Montar projeto (primeira vez)
        id: montar
        if: ${{ hashFiles('projeto.b64') != '' }}
        run: |
          base64 -d projeto.b64 | tar -xz
          rm projeto.b64

      - name: Gravar arquivos do projeto
        if: ${{ steps.montar.outcome == 'success' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Arquivos do projeto DitaAíClaude (atalhos) v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar a página para o app
        run: cp pc/index.html app/src/main/assets/index.html

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ler versão
        id: ver
        run: echo "v=$(grep -oP "versionName '\\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DitaAiClaude-atalhos-v${{ steps.ver.outputs.v }}.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-build${{ github.run_number }}
          name: DitaAíClaude (atalhos) v${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          files: DitaAiClaude-atalhos-v${{ steps.ver.outputs.v }}.apk

      - name: Enviar APK pelo Telegram
        if: ${{ env.TG_TOKEN != '' }}
        run: |
          curl -sS -f "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            --form-string "chat_id=${TG_CHAT}" \
            --form-string "caption=DitaAíClaude (atalhos) v${{ steps.ver.outputs.v }} (build ${{ github.run_number }})" \
            -F "document=@DitaAiClaude-atalhos-v${{ steps.ver.outputs.v }}.apk" > /dev/null

      - name: Avisar falha pelo Telegram
        if: ${{ failure() && env.TG_TOKEN != '' }}
        run: |
          curl -sS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --form-string "chat_id=${TG_CHAT}" \
            --form-string "text=❌ DitaAíClaude (atalhos): compilação falhou. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
