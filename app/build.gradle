plugins {
    id 'com.android.application'
}

android {
    namespace 'br.rimonier.ditaaiclaude'
    compileSdk 34

    defaultConfig {
        applicationId 'br.rimonier.ditaaiclaude'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
